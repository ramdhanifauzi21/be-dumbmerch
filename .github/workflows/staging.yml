name: CI/CD Staging FE

on:
  push:
    branches:
      - staging

jobs:
  sonarqube:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: SonarQube scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=fe-dumbmerch-staging

  build:
    runs-on: self-hosted
    needs: sonarqube
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set image tag
        id: vars
        run: echo "image_tag=staging-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ secrets.DOCKER_REGISTRY }} -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_REGISTRY }}/fe-dumbmerch:${{ steps.vars.outputs.image_tag }} \
                        -t ${{ secrets.DOCKER_REGISTRY }}/fe-dumbmerch:staging .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_REGISTRY }}/fe-dumbmerch:${{ steps.vars.outputs.image_tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Push image to registry
        run: |
          docker push ${{ secrets.DOCKER_REGISTRY }}/fe-dumbmerch:${{ steps.vars.outputs.image_tag }}
          docker push ${{ secrets.DOCKER_REGISTRY }}/fe-dumbmerch:staging

  deploy:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Deploy to Apps Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APPS_HOST }}
          username: ${{ secrets.APPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 6969
          script: |
            echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ secrets.DOCKER_REGISTRY }} -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin
            cd /home/${{ secrets.APPS_USER }}/fe-staging
            docker compose pull
            docker compose up -d --force-recreate
            docker image prune -a -f

  test:
    runs-on: self-hosted
    needs: deploy
    steps:
      - name: Wait for container to be ready
        run: sleep 10

      - name: Verify staging deployment
        run: |
          WGET_OUT=$(wget --spider -t 5 --waitretry=5 https://api.staging.fauzi.studentdumbways.my.id 2>&1) || true
            if echo "$WGET_OUT" | grep -E -q '200 OK|405 Method Not Allowed|404 Not Found'; then
            echo "Deployment verified, server responded!"
            exit 0
          else
            echo "Deployment failed - host unreachable or error"
            echo "$WGET_OUT"
            exit 1
          fi
