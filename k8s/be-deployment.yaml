apiVersion: apps/v1
kind: Deployment
metadata:
  name: be-dumbmerch
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: be-dumbmerch
  template:
    metadata:
      labels:
        app: be-dumbmerch
    spec:
      imagePullSecrets:
        - name: registry-secret
      containers:
        - name: be-dumbmerch
          image: registry.fauzi.studentdumbways.my.id/be-dumbmerch:production
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: backend-secret
---
apiVersion: v1
kind: Service
metadata:
  name: be-dumbmerch-service
  namespace: production
spec:
  selector:
    app: be-dumbmerch
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: be-dumbmerch-ingress
  namespace: production
spec:
  ingressClassName: nginx
  rules:
    - host: api.fauzi.studentdumbways.my.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: be-dumbmerch-service
                port:
                  number: 80
